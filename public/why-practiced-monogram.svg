<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">WHY, PRACTICED W/P monogram</title>
  <desc id="desc">A custom W and P monogram in charcoal and antique bronze, framed by fine orbital arcs with a small four-point star.</desc>
  <g fill="none" stroke="#9B7658" stroke-linecap="round">
    <path d="M13.5 47A23 23 0 1 1 49 17.5" stroke-width="1.35"/>
    <path d="M8.7 36A27 27 0 0 1 42.8 6.2" stroke-width=".75" opacity=".7"/>
  </g>
  <!-- Custom W: three distinct valleys make the initial unmistakably W, even at favicon size. -->
  <path d="M4.5 17.5H10L16.1 39.8L21.9 17.5H27.1L32.6 39.8L39.2 17.5H45L35.9 50H30.8L24.5 30.6L18.6 50H13.5Z" fill="#191919"/>
  <!-- P sits to the right of the W as a fine bronze serif letter. -->
  <path d="M30.8 48.8V20.2H39.3C47.1 20.2 51.1 23.8 51.1 30.1C51.1 36.1 46.7 39.6 39.5 39.6H37.5V48.8Z" fill="#9B7658"/>
  <path d="M37.5 25V34.9H39.1C42.8 34.9 44.6 33.2 44.6 30C44.6 26.8 42.8 25 39.1 25Z" fill="#F6F3EC"/>
  <path d="M50 7.5L52.5 14L59 16.5L52.5 19L50 25.5L47.5 19L41 16.5L47.5 14Z" fill="#9B7658"/>
</svg>
