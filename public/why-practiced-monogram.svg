<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">WHY, PRACTICED W/P monogram</title>
  <desc id="desc">A clearly drawn W and P in charcoal and antique bronze, framed by fine orbital arcs and a small four-point star.</desc>
  <g fill="none" stroke="#9B7658" stroke-linecap="round">
    <path d="M13.5 47A23 23 0 1 1 48 17.5" stroke-width="1.2"/>
    <path d="M8.7 36A27 27 0 0 1 42 6.2" stroke-width=".7" opacity=".65"/>
  </g>
  <!-- The W is drawn as a continuous zig-zag, with both valleys visible. -->
  <path d="M4.5 18.5L11.5 43.5L19 18.5L26.5 43.5L34 18.5" fill="none" stroke="#191919" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Separate P stem and bowl: deliberately positioned beside the W, not over it. -->
  <path d="M37.5 48.5V18.5H44.3C51 18.5 54.8 21.8 54.8 27.5C54.8 33.2 51 36.5 44.3 36.5H42.5V48.5Z" fill="#9B7658"/>
  <path d="M42.5 23V32.2H44C47.5 32.2 49.2 30.6 49.2 27.6C49.2 24.6 47.5 23 44 23Z" fill="#F6F3EC"/>
  <path d="M50 7.5L52.5 14L59 16.5L52.5 19L50 25.5L47.5 19L41 16.5L47.5 14Z" fill="#9B7658"/>
</svg>