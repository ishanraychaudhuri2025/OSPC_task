name: Reconcile Bun lockfile

on:
  push:
    branches:
      - chore/security-deployment-hardening

permissions:
  contents: read

jobs:
  sync-lockfile:
    if: ${{ github.actor == 'ishanraychaudhuri2025' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Regenerate lockfile from package.json
        run: bun install

      - name: Commit lockfile only when it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build: reconcile Bun lockfile with package manifest"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:${GITHUB_REF_NAME}"
