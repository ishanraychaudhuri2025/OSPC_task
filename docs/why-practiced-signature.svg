<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 260" role="img" aria-labelledby="title desc">
  <title id="title">WHY, PRACTICED — brand signature</title>
  <desc id="desc">An original editorial wordmark with a custom W/P monogram, antique-bronze orbit, and the tagline Reflect, Learn, Grow.</desc>
  <rect width="1160" height="260" fill="#F6F3EC"/>
