  <text x="483" y="189" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="8.5" fill="#4F4A45">LEARN</text>
  <circle cx="625" cy="184" r="2.3" fill="#9B7658"/>
  <text x="649" y="189" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="8.5" fill="#4F4A45">GROW</text>
