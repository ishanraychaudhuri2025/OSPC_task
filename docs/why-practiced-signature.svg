<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">WHY, PRACTICED — wordmark</title>
  <desc id="desc">A restrained editorial wordmark with a high-contrast serif, bronze comma, fine divider and widely tracked tagline.</desc>
  <rect width="1200" height="280" fill="#F6F3EC"/>
  <text x="600" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="1.7" fill="#191919">WHY<tspan fill="#9B7658">,</tspan> PRACTICED</text>
  <path d="M320 145H880" stroke="#B9A28C" stroke-width="1"/>
  <text x="600" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="8" fill="#5E5A55">REFLECT  ·  LEARN  ·  GROW</text>
  <text x="600" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3.5" fill="#827A72">AN INDEPENDENT EDITORIAL STUDY</text>
</svg>