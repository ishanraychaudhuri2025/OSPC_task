    <path d="M61 144V56H86C108 56 120 67 120 85C120 103 107 114 86 114H82V144Z" fill="#9B7658"/>
    <path d="M82 70V100H86C98 100 105 95 105 85C105 75 98 70 86 70Z" fill="#F6F3EC"/>
    <path d="M143 0L149 15L164 21L149 27L143 42L137 27L122 21L137 15Z" fill="#9B7658"/>
