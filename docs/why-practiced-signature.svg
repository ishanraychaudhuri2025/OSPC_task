<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
  <title id="title">WHY, PRACTICED — luxury editorial signature</title>
  <desc id="desc">An interlocking W/P serif emblem with a fine antique-gold orbit and star, paired with a dramatic high-contrast serif wordmark and the tagline Reflect, Learn, Grow.</desc>
  <rect width="1400" height="340" fill="#F6F3EC"/>
  <g transform="translate(56 48) scale(2.7)">
    <path d="M17 66A31 31 0 1 1 59 13" fill="none" stroke="#9B7658" stroke-width="1.5" stroke-linecap="round"/>
    <text x="2" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="57" fill="#171717" letter-spacing="-5">W</text>
    <text x="42" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#9B7658" letter-spacing="-4">P</text>
    <path d="M62 5L65 13L73 16L65 19L62 27L59 19L51 16L59 13Z" fill="#9B7658"/>
  </g>
  <path d="M330 70V272" stroke="#B9A28C" stroke-width="1.2"/>
  <text x="385" y="157" font-family="Georgia, 'Times New Roman', serif" font-size="78" letter-spacing="1.2" fill="#171717">WHY, PRACTICED</text>
  <path d="M390 187H1300" stroke="#B9A28C" stroke-width="1"/>
  <text x="392" y="231" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="9" fill="#55504A">REFLECT</text>
  <circle cx="562" cy="226" r="2.4" fill="#9B7658"/>
  <text x="590" y="231" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="9" fill="#55504A">LEARN</text>
  <circle cx="730" cy="226" r="2.4" fill="#9B7658"/>
  <text x="758" y="231" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="9" fill="#55504A">GROW</text>
  <text x="392" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.6" fill="#827A72">SIMON SINEK</text>
</svg>
